<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excellence Tuition Classes - Student & Parent Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-6">
    <header class="max-w-5xl mx-auto flex justify-between items-center py-6 border-b border-slate-800">
        <h1 class="text-2xl font-extrabold text-blue-400">EXCELLENCE TUITION CLASSES</h1>
        <nav class="flex gap-4 text-xs font-semibold">
            <a href="index.html" class="hover:text-blue-400">Courses</a>
            <a href="register.html" class="hover:text-blue-400">Register</a>
            <a href="login.html" class="hover:text-blue-400">Login</a>
            <a href="feedback.html" class="hover:text-blue-400">Feedback</a>
            <a href="prizes.html" class="hover:text-blue-400">Prizes</a>
        </nav>
    </header>
    <main class="max-w-5xl mx-auto py-10">

            <div class="max-w-md mx-auto px-4 pt-10">
                
                <div class="glass-card p-8 rounded-3xl border border-slate-700/60 shadow-2xl relative overflow-hidden">
                    
                    <div class="text-center mb-8">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-white text-2xl mx-auto mb-3 shadow-lg shadow-blue-500/20">
                            <i class="fa-solid fa-user-lock"></i>
                        </div>
                        <h1 class="text-2xl font-extrabold text-white">Student &amp; Parent Portal</h1>
                        <p class="text-xs text-gray-400 mt-1">Access attendance, test marks, and recorded video lectures</p>
                    </div>

                    <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">Registered Email / Mobile</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500"><i class="fa-solid fa-envelope text-sm"></i></span>
                                <input type="text" id="login-identifier" required="" placeholder="student@example.com or 10-digit phone" class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 text-white text-sm focus:outline-none focus:border-blue-500 transition-colors">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">Password</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500"><i class="fa-solid fa-key text-sm"></i></span>
                                <input type="password" id="login-password" required="" placeholder="••••••••" class="w-full pl-10 pr-10 py-3 rounded-xl bg-slate-900/90 border border-slate-700 text-white text-sm focus:outline-none focus:border-blue-500 transition-colors">
                                <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-500 hover:text-white">
                                    <i id="password-toggle-icon" class="fa-solid fa-eye text-sm"></i>
                                </button>
                            </div>
                        </div>

                        <div class="flex items-center justify-between text-xs">
                            <label class="flex items-center text-gray-400 cursor-pointer">
                                <input type="checkbox" class="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-0 mr-2">
                                Remember Me
                            </label>
                            <a href="#" onclick="alert('Password reset link sent to registered phone/email.')" class="text-blue-400 hover:underline">Forgot Password?</a>
                        </div>

                        <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 font-extrabold text-white text-sm shadow-lg shadow-blue-500/25 hover:opacity-95 transition-all">
                            Sign In to Portal <i class="fa-solid fa-right-to-bracket ml-2"></i>
                        </button>
                    </form>

                    <!-- Social Login Section -->
                    <div class="mt-6 pt-6 border-t border-slate-800 text-center">
                        <p class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-4">Or Quick Login With</p>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="simulateSocialLogin('Google')" class="py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 hover:border-slate-600 text-xs font-bold text-gray-300 flex items-center justify-center gap-2 transition-all">
                                <i class="fa-brands fa-google text-red-400"></i> Google
                            </button>
                            <button onclick="simulateSocialLogin('WhatsApp OTP')" class="py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 hover:border-slate-600 text-xs font-bold text-gray-300 flex items-center justify-center gap-2 transition-all">
                                <i class="fa-brands fa-whatsapp text-emerald-400"></i> WhatsApp
                            </button>
                        </div>
                    </div>

                    <p class="text-center text-xs text-gray-400 mt-6">
                        Not registered yet? <button onclick="navigateTo('register')" class="text-cyan-400 font-bold hover:underline">Apply for Admission</button>
                    </p>

                </div>

            </div>
        
</main>
    <footer class="max-w-5xl mx-auto py-8 border-t border-slate-800 text-center text-xs text-gray-500">
        &copy; 2026 Excellence Tuition Classes. All Rights Reserved.
    </footer>
</body>
</html>
